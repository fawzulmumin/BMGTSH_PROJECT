<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <title>Prediksi Produksi Padi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tambahkan plugin heatmap -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-heatmap@1.0.0/dist/chartjs-chart-heatmap.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1>Prediksi Produksi Padi di Wilayah Sumatera</h1>
                <form id="predictForm">
                    <div class="mb-3">
                        <label for="Provinsi" class="form-label">Provinsi:</label>
                        <select id="Provinsi" name="Provinsi" class="form-select">
                            <option value="Aceh">Aceh</option>
                            <option value="Sumatera Utara">Sumatera Utara</option>
                            <option value="Sumatera Barat">Sumatera Barat</option>
                            <option value="Riau">Riau</option>
                            <option value="Jambi">Jambi</option>
                            <option value="Sumatera Selatan">Sumatera Selatan</option>
                            <option value="Bengkulu">Bengkulu</option>
                            <option value="Lampung">Lampung</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="Tahun" class="form-label">Tahun:</label>
                        <select id="Tahun" name="Tahun" class="form-select" required>
                            <!-- Options will be added by JavaScript -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="Luas Panen" class="form-label">Luas Panen (ha):</label>
                        <input type="number" id="Luas Panen" name="Luas Panen" class="form-control" placeholder="Masukkan Luas Panen" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="Curah hujan" class="form-label">Curah Hujan (mm):</label>
                        <input type="number" id="Curah hujan" name="Curah hujan" class="form-control" placeholder="Masukkan Curah Hujan" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="Kelembapan" class="form-label">Kelembapan (%):</label>
                        <input type="number" id="Kelembapan" name="Kelembapan" class="form-control" placeholder="Masukkan Kelembapan" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="Suhu rata-rata" class="form-label">Suhu Rata-rata (°C):</label>
                        <input type="number" id="Suhu rata-rata" name="Suhu rata-rata" class="form-control" placeholder="Masukkan Suhu Rata-rata" step="0.01" required>
                    </div>
                    <div class="mb-3 text-center">
                        <button type="submit" class="btn btn-primary">Prediksi</button>
                    </div>
                </form>
                <p id="predictionResult" class="text-center"></p>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-md-12">
                <h2>Visualisasi Data</h2>
                <!-- Flex container for horizontal layout -->
                <div class="d-flex justify-content-between">
                    <div class="p-2">
                        <canvas id="barChart" width="400" height="200"></canvas>
                    </div>
                    <div class="p-2">
                        <canvas id="lineChart" width="400" height="200"></canvas>
                    </div>
                    <div class="p-2">
                        <canvas id="correlationMatrix" width="400" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript to populate the year dropdown
        document.addEventListener('DOMContentLoaded', function () {
            const yearSelect = document.getElementById('Tahun');
            const startYear = 2000;
            const endYear = 2100;

            for (let year = startYear; year <= endYear; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            }
        });
    </script>
</body>

</html>
